<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/0_icons/favicon.png">
    <title>El Pollo Loco</title>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chicken-small.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar-health.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/fullscreen.class.js"></script>
    <script src="models/speaker.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/bottles.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    
    
    

</head>
<body>
    
<div id="start-screen" class="start-screen">
    <img src="img/9_intro_outro_screens/start/startscreen_2.png" class="start-img">

    <button id="start-btn" class="start-btn" onclick="init()">
        Start Game
    </button>

    <div id="legal" class="legal">
        <a href="privacy-policy.html" target="_blank">Privacy Policy</a>
        <a href="impressum.html" target="_blank">Impressum</a>
    </div>
</div>


<div id="lose-screen" class="lose-screen d-none">
    <img src="img/You won, you lost/Game Over.png" class="game-over-img">

    <button id="restart-btn" class="restart-btn" onclick="restartGame()">
        <img src="img/0_icons/replay2.png" class="restart-icon">
        <p>Back to menu</p>
    </button>

</div>


<div>
    <div id="win-screen" class="win-screen d-none">
        <img src="img/You won, you lost/You Win A.png" class="win-img">

        <button id="restart-btn" class="restart-btn" onclick="restartGame()">
            <img src="img/0_icons/replay2.png" class="restart-icon">
            <p>Back to menu</p>
        </button>
</div>



    <!-- <h1>El Pollo Loco</h1> -->

    <!-- <canvas id="canvas" width="720" height="480" class="d-none">
        
    </canvas> -->
    <div id="game-container" class="game-container">

        <canvas id="canvas" width="720" height="480"></canvas>

        <div class="panel-wrapper">
            <div class="btn-wrapper">
                    <button id="btnLeft"><img src="img/0_icons/left-grey.png"></button>
                    <button id="btnRight"><img src="img/0_icons/right-grey.png"></button>
                </div>
                <div class="btn-wrapper">
                    <button id="btnJump"><img src="img/0_icons/jump1-grey.png"></button>
                    <button id="btnThrow"><img src="img/0_icons/throw-grey.png"></button>
                </div>
        </div>
    </div>


    <div id="mobile-advice" class="mobile-advice d-none">
        <div class="mobile-advice-content">
        <img src="img/0_icons/mobile-rotate-grey.png">
        <p>Turn your device to play!</p>
        </div>
    </div>
    

    

<script src="js/game.js"></script>
</body>
</html>
